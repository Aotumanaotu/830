<circle cx="80.00" cy="202.45" r="3" fill="#2563eb"><title>2026-10-08 coverage: 9.7%</title></circle>
<circle cx="390.00" cy="201.11" r="3" fill="#2563eb"><title>2026-10-09 coverage: 10.6%</title></circle>
<circle cx="700.00" cy="199.62" r="3" fill="#2563eb"><title>2026-10-10 coverage: 11.7%</title></circle>
<polyline points="80.00,202.45 390.00,201.11 700.00,199.62" fill="none" stroke="#2563eb" stroke-width="2.5"/>
